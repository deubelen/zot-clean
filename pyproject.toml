[project]
name = "zot-clean"
version = "0.4.1"
description = "Mettre et garder de l'ordre dans sa bibliothèque Zotero"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Eubelen" }]
requires-python = ">=3.11"
keywords = ["zotero", "bibliographie", "références", "doublons", "métadonnées", "better-bibtex", "recherche"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = [
    "httpx2>=2.13.1,<3",
    "pypdf>=6.19.0",
    "pyzotero>=1.15.2,<1.16",  # api.py s'appuie sur son client HTTP (D193)
]

[project.urls]
Homepage = "https://github.com/deubelen/zot-clean"
Issues = "https://github.com/deubelen/zot-clean/issues"

[project.scripts]
zc = "zot_clean.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# La distribution source ne garde que le code, le README et la licence, sans docs/ ni tests/.
[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/zot_clean"]
